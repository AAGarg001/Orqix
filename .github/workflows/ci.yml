name: Verify platform
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # Keep the native MongoDB test binary on a stable Linux runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      WORKER_RUNTIME: "local"
      METADATA_STORE: "memory"
      PYTHON_EXECUTABLE: "python"
      PRIVATE_FILE_STORAGE: "local"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - name: Install isolated native MongoDB test binary
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/orqix-mongo"
          curl -fsSL https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-8.0.17.tgz | tar -xz -C "$RUNNER_TEMP/orqix-mongo" --strip-components=1
          echo "MONGOD_BINARY=$RUNNER_TEMP/orqix-mongo/bin/mongod" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r workers/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pytest workers/tests -q
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Install native cloud browser runtime
        run: python3 scripts/setup-native.py
      - name: Verify native Python and visible Chromium on a virtual display
        run: node scripts/start-native.mjs --smoke
      - name: Save browser failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
