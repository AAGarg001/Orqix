# Replace the hostname/certificate paths. API port must remain private.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name orqix.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name orqix.example.com;
    ssl_certificate /etc/letsencrypt/live/orqix.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orqix.example.com/privkey.pem;
    client_max_body_size 11m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
